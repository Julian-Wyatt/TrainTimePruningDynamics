defaults:
  - base_config
  - _self_

# Top-level CLI overrides (not training config)
config_path: null
saving_root_dir: "${hydra:runtime.cwd}/saves"
desc: ""

hydra:
  run:
    dir: saves/slurm_outputs/${now:%y/%m/%d-%H:%M}
  sweep:
    dir: saves/slurm_outputs/multirun/${now:%y/%m/%d-%H:%M}
    subdir: ${hydra.job.num}

DATASET:
  NAME: ""
  ROOT_DIR: ""
  IMG_SIZE: [512, 512]
  NUM_CLASSES: 150
  IGNORE_INDEX: 255
  RESAMPLE_EMPTY_MASKS: true
  EMPTY_MASK_MAX_RETRIES: 10
  EXCLUDE_BACKGROUND_CLASS: false
  BINARY_FG_CHANNEL: 1
  MEAN: [0.485, 0.456, 0.406]
  STD:  [0.229, 0.224, 0.225]
  OVERFIT_BATCHES: 0

MODEL:
  BACKBONE: "vit_base_patch16_dinov3.lvd1689m"
  CKPT_PATH: ""
  PATCH_SIZE: 16
  DROP_PATH_RATE: 0.0
  FREEZE_BACKBONE_N_BLOCKS: 0
  UNFREEZE_BACKBONE_EPOCH: -1
  EMA_DECAY: 0.9999
  EMA_VALIDATE: true
  NUM_QUERIES: 200
  NUM_QUERY_BLOCKS: 3
  MASKED_ATTN: true
  USE_CROPR: false
  CROPR_PRUNING_RATE: 88
  ROUTING_START: 2
  ROUTING_END: 10
  CROPR_STATIC_PRUNING: false
  CROPR_STATIC_PRUNE_MULT: 1.0
  CROPR_SCHEDULE: "legacy"
  CROPR_KEEP_FRACTION: null
  CROPR_DERIVE_PRUNING_RATE: false
  CROPR_REFERENCE_PRUNE_TOKENS: 40
  CROPR_REFERENCE_SPATIAL_TOKENS: 1024
  PRUNE_ROUND_MULTIPLE: 8
  USE_EOMT_PRUNING: false
  EOMT_PRUNE_LAYERS: [2, 5, 8]
  EOMT_KEEP_RATES: [0.7, 0.7, 0.7]
  EOMT_PRUNE_TRAIN_MODE: "dense"
  EOMT_PRUNE_EVAL_MODE: "dense"
  EOMT_PRUNE_REINJECT: "penultimate"
  EOMT_PRUNE_LOSS_WEIGHT: 1.0
  EOMT_PRUNE_GUMBEL_TAU: 1.0
  EOMT_PRUNE_RAMP_EPOCHS: 0
  EOMT_PRUNE_AUX_SCORER: false
  EOMT_PRUNE_AUX_LOSS_WEIGHT: 1.0
  EOMT_PRUNE_RANDOM_WINDOW_BOUNDS: false
  EOMT_PRUNE_ROUTING_KEEP_RATE: -1.0
  EOMT_PRUNE_ROUTE_START_AFTER_BLOCK: -1
  EOMT_PRUNE_ROUTE_END_AFTER_BLOCK: -1
  ATTN_MASK_ANNEALING_ENABLED: true
  ATTN_MASK_ANNEALING_START_STEPS: [2, 4, 6, 8]
  ATTN_MASK_ANNEALING_END_STEPS: [4, 6, 8, 10]
  ATTN_MASK_POLY_POWER: 0.9

TRAIN:
  BATCH_SIZE: 4
  EFFECTIVE_BATCH_SIZE: null
  LR: 0.0002
  WEIGHT_DECAY: 0.05
  EPOCHS: 50
  NUM_WORKERS: 8
  SEED: 42
  COMPILE: true
  OPTIMIZER: "adamw"
  ADAM_BETAS: [0.9, 0.999]
  MOMENTUM: 0.9
  LLRD: 1.0
  LR_MULT: 1.0
  CLIP_GRAD_VAL: 1.0
  MIN_LR_FRAC: 0.0
  LLRD_FULL_LR_LAST_N_BLOCKS: true
  ORIGINAL_EOMT_LR_MULT_COMPAT: false
  TASK: "segmentation"
  TRAINER_TYPE: "auto"
  LOSS_TYPE: "mask2former"
  DICE_WEIGHT: 1.0

  # Mask2Former loss weights
  M2F_NUM_POINTS: 12544
  M2F_OVERSAMPLE_RATIO: 3.0
  M2F_IMPORTANCE_SAMPLE_RATIO: 0.75
  M2F_MASK_COEF: 5.0
  M2F_DICE_COEF: 5.0
  M2F_CLASS_COEF: 2.0
  M2F_NO_OBJECT_COEF: 0.1

  SCHEDULE_NAME: "cosine"
  WARMUP_RATIO: 0.05
  WARMDOWN_RATIO: 0.0

  # Two-stage warmup: head params warm first, backbone frozen then delayed warmup
  SPLIT_WARMUP: true
  WARMUP_STEPS: [10, 50]

  VAL_EVERY_N_EPOCHS: 5
  CKPT_EVERY_N_EPOCHS: 1
  LOG_BOUNDARY_IOU: false
  LOG_CLDICE: false
  LOG_THIN_VESSEL_DICE: false
  BOUNDARY_WIDTH: 5
  MAX_SAVED_CHECKPOINTS: 1
  LOG_TYPE: "none"
  PROJECT: ""
  RUN_TRAIN: true
  RUN_TEST: true
  SAVING_ROOT_DIR: "${hydra:runtime.cwd}/saves"
  DESCRIPTION: ""
  CHECKPOINT_FILE: ""
  MAX_RESUBMIT: 0
  BEST_METRIC: "mIoU"
  SAVE_CHECKPOINTS: "auto"
  RUN_LOCAL_TEST: false
  RUN_ID: ""
  FRESH_RUN: true
  THROUGHPUT_TEST: false
  THROUGHPUT_WARMUP_BATCHES: 50
  THROUGHPUT_MEASURE_BATCHES: 200
  DRY_RUN: false

AUGMENTATIONS:
  RANDOM_SCALE: [0.1, 2.0]
  RANDOM_CROP: [512, 512]
  HORIZONTAL_FLIP: 0.5
  COLOR_JITTER: 0.4
  USE_LSJ: false
